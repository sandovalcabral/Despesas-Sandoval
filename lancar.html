<script>
  // O SEU LINK AQUI
  const URL_API = "https://script.google.com/macros/s/AKfycbxhSWpaPYmhUINdWO6g6RpaRC0y3kKo2-FZaEcueO0p0BK3DSxs4rPY1GhvMf4k08U/exec";

  // Função para forçar a Data Local (evita o bug do dia seguinte)
  function getDataLocalFormatada() {
    const d = new Date();
    const ano = d.getFullYear();
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
  }

  const hoje = new Date();
  document.getElementById('data').value = getDataLocalFormatada();
  document.getElementById('mesInicial').value = hoje.getMonth() + 1;
  document.getElementById('anoInicial').value = hoje.getFullYear();

  const form = document.getElementById('formLancar');
  const btn = document.getElementById('btnEnviar');
  const msg = document.getElementById('mensagem');

  form.addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    btn.disabled = true;
    btn.textContent = "A gravar na planilha...";
    msg.style.display = "none";

    const formData = new FormData(form);
    const dados = new URLSearchParams(formData);

    fetch(URL_API, {
      method: 'POST',
      body: dados
    })
    .then(response => response.json())
    .then(data => {
      if(data.status === "sucesso") {
        msg.textContent = "Lançamento guardado com sucesso na planilha!";
        msg.className = "sucesso";
        msg.style.display = "block";
        
        form.reset();
        // Repõe as datas corretamente após limpar o formulário
        document.getElementById('data').value = getDataLocalFormatada();
        document.getElementById('mesInicial').value = new Date().getMonth() + 1;
        document.getElementById('anoInicial').value = new Date().getFullYear();
        document.getElementById('parcelas').value = 1;
      } else {
        msg.textContent = "Erro ao gravar: " + data.mensagem;
        msg.className = "erro";
        msg.style.display = "block";
      }
    })
    .catch(error => {
      msg.textContent = "Lançamento efetuado! (Aviso: Sem resposta final do servidor, mas deve estar na planilha)";
      msg.className = "sucesso";
      msg.style.display = "block";
      form.reset();
      document.getElementById('data').value = getDataLocalFormatada();
      document.getElementById('mesInicial').value = new Date().getMonth() + 1;
      document.getElementById('anoInicial').value = new Date().getFullYear();
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = "Salvar na Planilha";
    });
  });
</script>
