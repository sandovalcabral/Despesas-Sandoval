<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Despesas — Sandoval</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #10141a;
            --panel: #1a2029;
            --panel-2: #212836;
            --line: #2b3241;
            --ink: #e9e6de;
            --ink-dim: #9aa2ae;
            --gold: #d9a441;
            --green: #4c9a6a;
            --rust: #c1584b;
            --sans: "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--sans); }
        body { background: var(--bg); color: var(--ink); padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
        h1 { font-size: 1.5rem; color: var(--gold); }
        .status { font-size: 0.85rem; padding: 5px 10px; border-radius: 4px; background: var(--panel-2); color: var(--ink-dim); }
        .status.online { background: rgba(76, 154, 106, 0.2); color: var(--green); }
        .status.offline { background: rgba(193, 88, 75, 0.2); color: var(--rust); }
        .btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { opacity: 0.9; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--line); }
        .filter-group label { display: block; font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 5px; }
        .filter-group select, .filter-group input { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); padding: 8px; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
        .card h3 { font-size: 1rem; color: var(--gold); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line); }
        th { color: var(--ink-dim); font-weight: 600; }
        .table-container { overflow-x: auto; background: var(--panel); border-radius: 8px; padding: 15px; border: 1px solid var(--line); margin-top: 20px; }
        .actions { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Dashboard de Despesas — Sandoval</h1>
            <p id="sub-status" style="font-size: 0.85rem; color: var(--ink-dim);">A carregar dados da planilha...</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="lancar.html" class="btn">+ Novo Lançamento</a>
            <span id="server-status" class="status">A verificar...</span>
        </div>
    </header>

    <div class="filters">
        <div class="filter-group">
            <label>Ano</label>
            <select id="filtro-ano" onchange="atualizarDashboard()">
                <option value="Todos">Todos</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Mês</label>
            <select id="filtro-mes" onchange="atualizarDashboard()">
                <option value="Todos">Todos</option>
                <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Pessoa</label>
            <select id="filtro-pessoa" onchange="atualizarDashboard()">
                <option value="Todas">Todas</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Cartão / Forma</label>
            <select id="filtro-cartao" onchange="atualizarDashboard()">
                <option value="Todos">Todos</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Situação</label>
            <select id="filtro-situacao" onchange="atualizarDashboard()">
                <option value="Todas">Todas</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Evolução por Mês</h3>
            <canvas id="chartEvolucao" height="150"></canvas>
        </div>
        <div class="card">
            <h3>Gasto por Pessoa</h3>
            <canvas id="chartPessoa" height="150"></canvas>
        </div>
    </div>

    <div class="table-container">
        <div class="actions">
            <h3>Lançamentos</h3>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Pessoa</th>
                    <th>Valor</th>
                    <th>Parcela</th>
                    <th>Cartão</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody id="tabela-registros">
                <tr><td colspan="7" style="text-align: center;">A carregar registos...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let dadosGlobais = [];
        let chartEvolucaoObj = null;
        let chartPessoaObj = null;

        async function carregarDados() {
            const statusEl = document.getElementById("server-status");
            const subStatusEl = document.getElementById("sub-status");
            
            try {
                // COLE O SEU LINK DO APPS SCRIPT ABAIXO ENTRE AS ASPAS:
                const URL_API = "https://script.google.com/macros/s/AKfycbyFVwk5sfuN4A5HzjLnW-Jk-G_4zcrRRdG5R0UiQ1mHFnrMQYmdEnMx3J8rgF9MVsYi/exec"; 
                
                const resp = await fetch(URL_API + "?_=" + Date.now(), {cache: "no-store"});
                const json = await resp.json();
                
                if (json.erro) throw new Error(json.erro);

                dadosGlobais = json.registros || [];
                statusEl.textContent = "Servidor Online";
                statusEl.className = "status online";
                subStatusEl.textContent = "Atualizado em: " + new Date(json.atualizadoEm).toLocaleString();

                popularFiltros();
                atualizarDashboard();
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Servidor Indisponível";
                statusEl.className = "status offline";
                subStatusEl.textContent = "Erro ao ligar à planilha. Verifique o link do Apps Script.";
            }
        }

        function popularFiltros() {
            const anos = [...new Set(dadosGlobais.map(r => r.ano).filter(Boolean))].sort();
            const pessoas = [...new Set(dadosGlobais.map(r => r.categoria).filter(Boolean))].sort();
            const cartoes = [...new Set(dadosGlobais.map(r => r.cartao).filter(Boolean))].sort();
            const situacoes = [...new Set(dadosGlobais.map(r => r.situacao).filter(Boolean))].sort();

            preencherSelect("filtro-ano", anos);
            preencherSelect("filtro-pessoa", pessoas);
            preencherSelect("filtro-cartao", cartoes);
            preencherSelect("filtro-situacao", situacoes);
        }

        function preencherSelect(id, valores) {
            const el = document.getElementById(id);
            const atual = el.value;
            const primeiroOpt = el.options[0].text;
            el.innerHTML = `<option value="Todos">${primeiroOpt}</option>`;
            valores.forEach(v => {
                el.innerHTML += `<option value="${v}">${v}</option>`;
            });
            el.value = atual;
        }

        function atualizarDashboard() {
            const fAno = document.getElementById("filtro-ano").value;
            const fMes = document.getElementById("filtro-mes").value;
            const fPessoa = document.getElementById("filtro-pessoa").value;
            const fCartao = document.getElementById("filtro-cartao").value;
            const fSituacao = document.getElementById("filtro-situacao").value;

            const filtrados = dadosGlobais.filter(r => {
                if (fAno !== "Todos" && String(r.ano) !== fAno) return false;
                if (fMes !== "Todos" && String(r.mes) !== fMes) return false;
                if (fPessoa !== "Todas" && r.categoria !== fPessoa) return false;
                if (fCartao !== "Todos" && r.cartao !== fCartao) return false;
                if (fSituacao !== "Todas" && r.situacao !== fSituacao) return false;
                return true;
            });

            atualizarTabela(filtrados);
            atualizarGraficos(filtrados);
        }

        function atualizarTabela(registros) {
            const tbody = document.getElementById("tabela-registros");
            if (registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">Nenhum registo encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = registros.slice(0, 100).map(r => `
                <tr>
                    <td>${r.data || ''}</td>
                    <td>${r.descricao || ''}</td>
                    <td>${r.categoria || ''}</td>
                    <td>R$ ${(Number(r.valor) || 0).toFixed(2)}</td>
                    <td>${r.parcela || ''}</td>
                    <td>${r.cartao || ''}</td>
                    <td>${r.situacao || ''}</td>
                </tr>
            `).join('');
        }

        function atualizarGraficos(registros) {
            const ctxEvolucao = document.getElementById("chartEvolucao").getContext("2d");
            const ctxPessoa = document.getElementById("chartPessoa").getContext("2d");

            if (chartEvolucaoObj) chartEvolucaoObj.destroy();
            if (chartPessoaObj) chartPessoaObj.destroy();

            chartEvolucaoObj = new Chart(ctxEvolucao, {
                type: 'bar',
                data: {
                    labels: ['Total Registos'],
                    datasets: [{ label: 'Qtd', data: [registros.length], backgroundColor: '#d9a441' }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            chartPessoaObj = new Chart(ctxPessoa, {
                type: 'doughnut',
                data: {
                    labels: ['Registos'],
                    datasets: [{ data: [registros.length], backgroundColor: ['#4c9a6a', '#c1584b', '#d9a441'] }]
                },
                options: { responsive: true }
            });
        }

        carregarDados();
    </script>
</body>
</html>
